name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: paping-go-linux-amd64
          - goos: linux
            goarch: arm64
            name: paping-go-linux-arm64
          - goos: windows
            goarch: amd64
            name: paping-go-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            name: paping-go-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: paping-go-darwin-arm64

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.sha) }}
        run: go build -ldflags "-X main.version=${VERSION}" -o "${{ matrix.name }}" ./cmd/paping-go

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Install nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build Debian packages
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"

          NFPM_VERSION="$VERSION" \
          NFPM_ARCH=amd64 \
          NFPM_BINARY=./dist/paping-go-linux-amd64 \
          nfpm package \
            --config packaging/nfpm.yaml \
            --packager deb \
            --target "dist/paping-go_${VERSION}_amd64.deb"

          NFPM_VERSION="$VERSION" \
          NFPM_ARCH=arm64 \
          NFPM_BINARY=./dist/paping-go-linux-arm64 \
          nfpm package \
            --config packaging/nfpm.yaml \
            --packager deb \
            --target "dist/paping-go_${VERSION}_arm64.deb"

      - name: Generate checksums
        working-directory: dist
        run: sha256sum paping-go-* *.deb > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
