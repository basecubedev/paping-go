name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: [ "1.23.x", "stable" ]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Go version
        run: go version

      - name: Tidy modules
        run: go mod tidy

      - name: Format
        run: go fmt ./...

      - name: Check generated changes
        run: git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race tests
        if: matrix.go-version == 'stable'
        run: go test -race ./...

      - name: Build
        run: go build -o paping-go .
