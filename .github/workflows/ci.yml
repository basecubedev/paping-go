name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: [ "1.23.x", "stable" ]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Go version
        run: go version

      - name: Verify vendored viewer assets
        run: |
          npm ci --ignore-scripts
          cmp tools/vendor/plotly.min.js node_modules/plotly.js-dist-min/plotly.min.js || {
            echo "tools/vendor/plotly.min.js is out of sync; run npm ci and vendor the Plotly asset."
            exit 1
          }
          cmp tools/vendor/plotly.min.js.LICENSE.txt node_modules/plotly.js-dist-min/LICENSE || {
            echo "tools/vendor/plotly.min.js.LICENSE.txt is out of sync; run npm ci and vendor the Plotly license."
            exit 1
          }

      - name: Tidy modules
        run: go mod tidy

      - name: Format
        run: go fmt ./...

      - name: Check generated changes
        run: git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out

      - name: Enforce coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${total}%"
          awk -v total="$total" 'BEGIN { if (total + 0 < 85) exit 1 }'

      - name: Race tests
        if: matrix.go-version == 'stable'
        run: go test -race ./...

      - name: Build
        run: go build -o paping-go ./cmd/paping-go
